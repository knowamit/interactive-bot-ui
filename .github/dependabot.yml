version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    groups:
      android-toolchain:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "gradle-wrapper"
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
