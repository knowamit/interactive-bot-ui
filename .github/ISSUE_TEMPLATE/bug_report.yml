name: Bug report
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android (Compose), iOS (SwiftUI), Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: The BotView call and BotStyle you used.
      render: text
  - type: input
    id: version
    attributes:
      label: Library version and OS or device
