name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and demo build
        working-directory: android
        run: ./gradlew :botui:testDebugUnitTest :app:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift tests
        run: swift test
